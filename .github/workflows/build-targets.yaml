name: Build target toolboxes

on:
  push:
    branches:
      - main
    paths:
      - build-targets/**
      - build/dependencies.sh
      - .github/workflows/build-targets.yaml
  pull_request:
    paths:
      - build-targets/**
      - build/dependencies.sh
      - .github/workflows/build-targets.yaml
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if dependencies are unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: build-targets-debian12-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

env:
  BASE_TAG: docker.io/library/debian:bookworm-slim
  IMAGE: ghcr.io/engity-com/build-images/build

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ['386', amd64, armv7, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: engity-build-${{ matrix.target }}:test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Resolve dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          fingerprint=$(sh build-targets/dependencies.sh prepare "$base_image" "${{ matrix.target }}" build-targets/dependency-state.txt)
          {
            echo "base_image=$base_image"
            echo "base_digest=${base_image##*@}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: build-targets
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=build-debian12-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=build-debian12-${{ matrix.target }}

      - name: Test local image
        env:
          BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
        run: sh build-targets/test.sh "$LOCAL_IMAGE" "$BASE_DIGEST" "$DEPENDENCY_FINGERPRINT" "${{ matrix.target }}"

  check:
    if: github.event_name != 'pull_request'
    name: Check target dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Check published fingerprints
        id: check
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          builds='[]'
          {
            echo '## Target toolbox dependency check'
            echo
            echo "- Base: \`$base_image\`"
          } >>"$GITHUB_STEP_SUMMARY"

          for target in 386 amd64 armv7 arm64; do
            expected=$(sh build-targets/dependencies.sh prepare "$base_image" "$target" build-targets/dependency-state.txt)
            published=$(build/dependencies.sh remote-image-state "$IMAGE:debian12-$target")
            status=$(awk -F= '$1 == "status" { print $2 }' <<<"$published")
            case "$status" in
              missing) current=missing ;;
              present)
                current=$(awk -F= '$1 == "fingerprint" { print $2 }' <<<"$published")
                base_digest=$(awk -F= '$1 == "base_digest" { print $2 }' <<<"$published")
                if [[ "$current" == "$expected" && "$base_digest" != "${base_image##*@}" ]]; then
                  echo "Published base digest for $target does not match" >&2
                  exit 1
                fi
                ;;
              *) echo "Invalid remote image status for $target" >&2; exit 1 ;;
            esac
            decision=$(build/dependencies.sh decision "$current" "$expected" "$FORCE" true)
            build=$(awk -F= '$1 == "build" { print $2 }' <<<"$decision")
            reason=$(awk -F= '$1 == "reason" { print $2 }' <<<"$decision")
            if [[ "$build" == true ]]; then
              builds=$(jq -cn --argjson previous "$builds" --arg target "$target" --arg fingerprint "$expected" \
                --arg base_image "$base_image" '$previous + [{target:$target, fingerprint:$fingerprint, base_image:$base_image}]')
            fi
            echo "- \`debian12-$target\`: \`$reason\` (fingerprint \`$expected\`)" >>"$GITHUB_STEP_SUMMARY"
          done

          if [[ "$builds" == '[]' ]]; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi
          echo "matrix=$(jq -cn --argjson include "$builds" '{include:$include}')" >>"$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    name: Publish ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: engity-build-${{ matrix.target }}:test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Revalidate dependencies
        id: dependencies
        env:
          EXPECTED_BASE_IMAGE: ${{ matrix.base_image }}
          EXPECTED_FINGERPRINT: ${{ matrix.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          fingerprint=$(sh build-targets/dependencies.sh prepare "$base_image" "${{ matrix.target }}" build-targets/dependency-state.txt)
          if [[ "$base_image" != "$EXPECTED_BASE_IMAGE" || "$fingerprint" != "$EXPECTED_FINGERPRINT" ]]; then
            echo 'Dependencies changed between the check and publish jobs' >&2
            exit 1
          fi
          {
            echo "base_image=$base_image"
            echo "base_digest=${base_image##*@}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=debian12-${{ matrix.target }}

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: build-targets
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=build-debian12-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=build-debian12-${{ matrix.target }}

      - name: Test local image
        env:
          BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
        run: sh build-targets/test.sh "$LOCAL_IMAGE" "$BASE_DIGEST" "$DEPENDENCY_FINGERPRINT" "${{ matrix.target }}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: build-targets
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=build-debian12-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=build-debian12-${{ matrix.target }}

      - name: Verify published image
        env:
          EXPECTED_BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          EXPECTED_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if state=$(build/dependencies.sh remote-image-state "$IMAGE:debian12-${{ matrix.target }}"); then
              status=$(awk -F= '$1 == "status" { print $2 }' <<<"$state")
              if [[ "$status" == present ]]; then
                digest=$(awk -F= '$1 == "index_digest" { print $2 }' <<<"$state")
                fingerprint=$(awk -F= '$1 == "fingerprint" { print $2 }' <<<"$state")
                base_digest=$(awk -F= '$1 == "base_digest" { print $2 }' <<<"$state")
                if [[ "$digest" == "$EXPECTED_DIGEST" && "$fingerprint" == "$EXPECTED_FINGERPRINT" && "$base_digest" == "$EXPECTED_BASE_DIGEST" ]]; then
                  exit 0
                fi
              fi
            fi
            if (( attempt < 6 )); then
              sleep "$((attempt * 2))"
            fi
          done
          echo "Published debian12-${{ matrix.target }} image did not match the build" >&2
          exit 1

      - name: Summarize publication
        if: always()
        env:
          FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          {
            echo "## Build toolbox debian12-${{ matrix.target }}"
            echo
            echo "- Fingerprint: \`$FINGERPRINT\`"
            echo "- Published index: \`$INDEX_DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
