name: Build toolbox

on:
  push:
    branches:
      - main
    paths:
      - build/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - build/**
      - .github/workflows/build.yaml
  schedule:
    - cron: '3 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if the dependency fingerprint is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: build-debian12-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

env:
  BASE_TAG: docker.io/library/debian:bookworm-slim
  IMAGE: ghcr.io/engity-com/build-images/build
  LOCAL_IMAGE: engity-build-toolbox:test

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: Build and test pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Resolve dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          base_digest=${base_image##*@}
          fingerprint=$(build/dependencies.sh prepare "$base_image" build/dependency-state.txt)
          {
            echo "base_image=$base_image"
            echo "base_digest=$base_digest"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Test build decisions
        run: build/dependencies.sh test-decision

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: engity-build-toolbox
          tags: type=raw,value=test

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
          cache-from: type=gha,scope=build-debian12
          cache-to: type=gha,mode=max,scope=build-debian12

      - name: Test local image
        env:
          BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
        run: build/test.sh "$LOCAL_IMAGE" "$BASE_DIGEST" "$DEPENDENCY_FINGERPRINT"

      - name: Summarize result
        if: always()
        env:
          BASE_IMAGE: ${{ steps.dependencies.outputs.base_image }}
          FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
        shell: bash
        run: |
          {
            echo "## Build toolbox"
            echo
            echo "- Event: pull request"
            echo "- Decision: local build and test; publication disabled"
            echo "- Base: \`$BASE_IMAGE\`"
            echo "- Fingerprint: \`$FINGERPRINT\`"
          } >>"$GITHUB_STEP_SUMMARY"

  check:
    if: github.event_name != 'pull_request'
    name: Check dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      base_image: ${{ steps.dependencies.outputs.base_image }}
      base_digest: ${{ steps.dependencies.outputs.base_digest }}
      fingerprint: ${{ steps.dependencies.outputs.fingerprint }}
      previous_fingerprint: ${{ steps.published.outputs.fingerprint }}
      tags_match: ${{ steps.published.outputs.tags_match }}
      build: ${{ steps.decision.outputs.build }}
      promote: ${{ steps.decision.outputs.promote }}
      reason: ${{ steps.decision.outputs.reason }}
      primary_digest: ${{ steps.published.outputs.primary_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Resolve dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          base_digest=${base_image##*@}
          fingerprint=$(build/dependencies.sh prepare "$base_image" build/dependency-state.txt)
          {
            echo "base_image=$base_image"
            echo "base_digest=$base_digest"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Read published fingerprint
        id: published
        env:
          EXPECTED_BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          EXPECTED_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          primary=$(build/dependencies.sh remote-image-state "$IMAGE:debian12")
          primary_status=$(awk -F= '$1 == "status" { print $2 }' <<<"$primary")
          if [[ "$primary_status" == missing ]]; then
            fingerprint=missing
            primary_digest=missing
            latest_digest=missing
            tags_match=false
          elif [[ "$primary_status" == present ]]; then
            fingerprint=$(awk -F= '$1 == "fingerprint" { print $2 }' <<<"$primary")
            published_base_digest=$(awk -F= '$1 == "base_digest" { print $2 }' <<<"$primary")
            primary_digest=$(awk -F= '$1 == "index_digest" { print $2 }' <<<"$primary")
            if [[ "$fingerprint" == "$EXPECTED_FINGERPRINT" && "$published_base_digest" != "$EXPECTED_BASE_DIGEST" ]]; then
              echo "Published base digest label does not match the resolved base" >&2
              exit 1
            fi
            latest=$(build/dependencies.sh remote-image-state "$IMAGE:latest")
            latest_status=$(awk -F= '$1 == "status" { print $2 }' <<<"$latest")
            latest_digest=$(awk -F= '$1 == "index_digest" { print $2 }' <<<"$latest")
            if [[ "$latest_status" == present && "$latest_digest" == "$primary_digest" ]]; then
              tags_match=true
            else
              tags_match=false
            fi
          else
            echo "Invalid remote image status" >&2
            exit 1
          fi
          {
            echo "fingerprint=$fingerprint"
            echo "primary_digest=$primary_digest"
            echo "latest_digest=$latest_digest"
            echo "tags_match=$tags_match"
          } >>"$GITHUB_OUTPUT"

      - name: Test build decisions
        run: build/dependencies.sh test-decision

      - name: Decide whether to build
        id: decision
        env:
          CURRENT: ${{ steps.published.outputs.fingerprint }}
          EXPECTED: ${{ steps.dependencies.outputs.fingerprint }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          TAGS_MATCH: ${{ steps.published.outputs.tags_match }}
        run: build/dependencies.sh decision "$CURRENT" "$EXPECTED" "$FORCE" "$TAGS_MATCH" >>"$GITHUB_OUTPUT"

      - name: Summarize check
        if: always()
        env:
          BASE_IMAGE: ${{ steps.dependencies.outputs.base_image }}
          BUILD: ${{ steps.decision.outputs.build }}
          PROMOTE: ${{ steps.decision.outputs.promote }}
          REASON: ${{ steps.decision.outputs.reason }}
          PREVIOUS_FINGERPRINT: ${{ steps.published.outputs.fingerprint }}
          FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          PRIMARY_DIGEST: ${{ steps.published.outputs.primary_digest }}
          LATEST_DIGEST: ${{ steps.published.outputs.latest_digest }}
        shell: bash
        run: |
          {
            echo "## Build toolbox dependency check"
            echo
            echo "- Decision: \`$REASON\`"
            echo "- Build required: \`$BUILD\`"
            echo "- Alias promotion required: \`$PROMOTE\`"
            echo "- Base: \`$BASE_IMAGE\`"
            echo "- Previous fingerprint: \`$PREVIOUS_FINGERPRINT\`"
            echo "- Resolved fingerprint: \`$FINGERPRINT\`"
            echo "- Current debian12 index: \`$PRIMARY_DIGEST\`"
            echo "- Current latest index: \`$LATEST_DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"

  promote-alias:
    needs: check
    if: needs.check.outputs.promote == 'true'
    name: Repair latest alias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote existing index
        env:
          SOURCE_DIGEST: ${{ needs.check.outputs.primary_digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$SOURCE_DIGEST"

      - name: Verify alias
        env:
          SOURCE_DIGEST: ${{ needs.check.outputs.primary_digest }}
        shell: bash
        run: |
          set -euo pipefail
          latest_digest=''
          for attempt in {1..6}; do
            if latest_digest=$(docker buildx imagetools inspect "$IMAGE:latest" | awk '$1 == "Digest:" { print $2; exit }') && [[ -n "$latest_digest" ]]; then
              break
            fi
            if (( attempt < 6 )); then
              sleep "$((attempt * 2))"
            fi
          done
          [[ "$latest_digest" == "$SOURCE_DIGEST" ]]

  publish:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Revalidate dependencies
        id: dependencies
        env:
          EXPECTED_BASE_IMAGE: ${{ needs.check.outputs.base_image }}
          EXPECTED_FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(build/dependencies.sh base-reference "$BASE_TAG")
          fingerprint=$(build/dependencies.sh prepare "$base_image" build/dependency-state.txt)
          if [[ "$base_image" != "$EXPECTED_BASE_IMAGE" || "$fingerprint" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "Dependencies changed between the check and publish jobs" >&2
            exit 1
          fi
          {
            echo "base_image=$base_image"
            echo "base_digest=${base_image##*@}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=debian12
            type=raw,value=latest

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
          cache-from: type=gha,scope=build-debian12
          cache-to: type=gha,mode=max,scope=build-debian12

      - name: Test local image
        env:
          BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          DEPENDENCY_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
        run: build/test.sh "$LOCAL_IMAGE" "$BASE_DIGEST" "$DEPENDENCY_FINGERPRINT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BASE_IMAGE=${{ steps.dependencies.outputs.base_image }}
            BASE_IMAGE_DIGEST=${{ steps.dependencies.outputs.base_digest }}
            DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
          cache-from: type=gha,scope=build-debian12
          cache-to: type=gha,mode=max,scope=build-debian12

      - name: Verify published image
        env:
          EXPECTED_BASE_DIGEST: ${{ steps.dependencies.outputs.base_digest }}
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_tag() {
            local tag=$1
            local attempt error_file state status
            error_file="$RUNNER_TEMP/verify-$tag.log"

            for attempt in {1..6}; do
              if state=$(build/dependencies.sh remote-image-state "$IMAGE:$tag" 2>"$error_file"); then
                status=$(awk -F= '$1 == "status" { print $2 }' <<<"$state")
                if [[ "$status" == present ]]; then
                  rm -f "$error_file"
                  printf '%s\n' "$state"
                  return
                fi
                printf 'Published tag %s is not visible yet\n' "$tag" >"$error_file"
              fi

              if (( attempt < 6 )); then
                sleep "$((attempt * 2))"
              fi
            done

            cat "$error_file" >&2
            return 1
          }

          debian12=$(verify_tag debian12)
          latest=$(verify_tag latest)
          debian12_digest=$(awk -F= '$1 == "index_digest" { print $2 }' <<<"$debian12")
          latest_digest=$(awk -F= '$1 == "index_digest" { print $2 }' <<<"$latest")
          fingerprint=$(awk -F= '$1 == "fingerprint" { print $2 }' <<<"$debian12")
          base_digest=$(awk -F= '$1 == "base_digest" { print $2 }' <<<"$debian12")

          [[ "$debian12_digest" == "$EXPECTED_DIGEST" ]]
          [[ "$latest_digest" == "$EXPECTED_DIGEST" ]]
          [[ "$fingerprint" == "$EXPECTED_FINGERPRINT" ]]
          [[ "$base_digest" == "$EXPECTED_BASE_DIGEST" ]]

      - name: Summarize publication
        if: always()
        env:
          BASE_IMAGE: ${{ steps.dependencies.outputs.base_image }}
          FINGERPRINT: ${{ steps.dependencies.outputs.fingerprint }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          REASON: ${{ needs.check.outputs.reason }}
        shell: bash
        run: |
          {
            echo "## Build toolbox publication"
            echo
            echo "- Decision: \`$REASON\`"
            echo "- Base: \`$BASE_IMAGE\`"
            echo "- Fingerprint: \`$FINGERPRINT\`"
            echo "- Published index: \`$INDEX_DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
